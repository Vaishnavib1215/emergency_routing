version: '3.8'

services:
  emergency-routing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emergency_routing_app
    ports:
      - "8000:7860"
    environment:
      - PORT=7860
      - HOST=0.0.0.0
      - CLOUD_STORAGE_PROVIDER=local
    volumes:
      - ./data/raw:/app/data/raw
      - ./models/saved_weights:/app/models/saved_weights
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
